<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Biodata - Versi Komponen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    /* Class Komponen Utama */
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 320px;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }
    .card-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1f2937;
      margin-bottom: 8px;
    }
    .card-text {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="card-img" src="https://via.placeholder.com/150" alt="Foto Profil Habib">
    <h2 class="card-title">Habib</h2>
    <p class="card-text">NIM: 051</p>
    <a href="#" class="btn">Lihat Profil</a>
  </div>

</body>
</html>
